name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        # 用官方源：GitHub runner 在境外，清华源反而慢
        run: uv sync --frozen --no-dev --index-url https://pypi.org/simple

      - name: 代码检查
        run: uv run ruff check .

      - name: 格式检查
        run: uv run ruff format --check .

      - name: 单元测试
        # 测试全是纯逻辑（无网络、无数据库），不需要任何 secret
        run: uv run pytest -q
