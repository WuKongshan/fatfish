[project]
name = "fatfish"
version = "0.1.0"
description = "大肥鱼 · 把 DeepSeek 接到 QQ 和微信的自带工具机器人"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.152.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
    # Windows 没有系统时区库，zoneinfo 会找不到 Asia/Shanghai
    "tzdata>=2026.6",
]

# 国内构建默认走清华源；境外构建改成 https://pypi.org/simple 或删掉这段
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]

[tool.uv]
# 包就在仓库根目录，运行 `python -m fatfish.main` 不需要额外安装
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 包在仓库根目录，不装也能 import（配合 [tool.uv] package = false）
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
